<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cápsula Digital</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fff8f6,#fff);color:#382b2b;min-height:100vh}.viewer{min-height:100vh}.loading,.error{max-width:680px;margin:8vh auto;padding:24px;border-radius:24px;background:#fff;border:1px solid #f0dfe1;box-shadow:0 12px 35px #8d435214}.bg{min-height:100vh;padding:28px 14px 70px;background:radial-gradient(circle at top,#fff 0,#fff5f7 45%,#fbe8ed 100%)}.bg.dark{background:radial-gradient(circle at top,#3a2630,#171216 65%);color:#fff}.bg.gold{background:radial-gradient(circle at top,#fffaf0,#f3e3bd 60%,#d8b66a);color:#302414}.card{max-width:720px;margin:auto;background:#ffffffdf;border:1px solid #ffffffaa;border-radius:32px;padding:clamp(22px,6vw,48px);box-shadow:0 30px 80px #5d243326;text-align:center}.dark .card{background:#241a20df}.cover{min-height:85vh;display:flex;align-items:center;justify-content:center}.icon{font-size:64px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800;opacity:.65}.title{font-family:Georgia,serif;font-size:clamp(38px,10vw,72px);margin:14px 0}.envelope{width:min(330px,88vw);height:210px;margin:25px auto;background:#f7d7df;border-radius:10px;box-shadow:0 25px 60px #5d24332b;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Georgia,serif;font-size:28px;transition:.35s}.envelope:active{transform:scale(.96)}.message{font-size:20px;line-height:1.75}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:28px 0}.gallery img{width:100%;height:260px;object-fit:cover;border-radius:18px}.gallery img:nth-child(3n+1){grid-column:1/-1;height:min(56vh,460px)}.final{font-family:Georgia,serif;font-size:clamp(26px,6vw,38px);line-height:1.45;margin:38px auto 20px;padding:28px 12px;border-top:1px solid currentColor;border-bottom:1px solid currentColor}audio,video,iframe{width:100%;border-radius:18px;border:0;margin-top:18px}.small{opacity:.7;font-size:13px}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:800;background:#c94d69;color:#fff;cursor:pointer}@media(max-width:560px){.gallery img{height:210px}.card{border-radius:26px;padding:22px 14px}}
</style></head>
<body><main id="viewer" class="viewer"><div class="loading"><h2>Abriendo tu cápsula…</h2><p class="small">Un momento ✨</p></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safe=u=>/^https:\/\//i.test(String(u||'').trim())?String(u).trim():'';
function yt(url){const s=String(url||'');const m=s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{6,})/);if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?playsinline=1&rel=0';const sp=s.match(/open\.spotify\.com\/(track|episode)\/([A-Za-z0-9]+)/i);return sp?'https://open.spotify.com/embed/'+sp[1].toLowerCase()+'/'+sp[2]:''}
function occasion(d){const o=String(d.occasion||'').toLowerCase(),e=String(d.experience||'');if(e==='proposal'||o.includes('propuesta'))return['💍','Tengo algo muy importante para ti','Hay una pregunta que puede cambiarlo todo'];if(e==='birthday'||o.includes('cumple'))return['🎂','Hay una sorpresa para ti','Hoy el mundo celebra que existes'];if(o.includes('aniversario'))return['🥂','Nuestra historia merece celebrarse','Un recuerdo de todo lo que hemos vivido'];return['❤️','Tienes algo especial',d.occasion||'Un momento especial']}
function render(d){const v=document.getElementById('viewer'),theme=['dark','gold'].includes(d.theme)?d.theme:'',o=occasion(d);v.innerHTML='<div class="bg '+theme+'"><div class="cover"><div><div class="icon">'+o[0]+'</div><p class="eyebrow">'+esc(o[2])+'</p><h1 class="title">'+esc(o[1])+'</h1><div class="envelope" id="open">'+esc(d.name||'Para ti')+'</div><p class="small">Toca el sobre para abrir tu sorpresa ✦</p></div></div></div>';
document.getElementById('open').onclick=()=>{const photos=(d.photos||[]).map(x=>'<img src="'+esc(x)+'" alt="Recuerdo" loading="lazy">').join(''),music=yt(d.music),voice=safe(d.voice),video=safe(d.video);v.innerHTML='<div class="bg '+theme+'"><div class="card"><p class="eyebrow">'+esc(d.occasion||'')+'</p><p class="small">'+esc(d.date||'')+'</p><h1 class="title">'+esc(d.name||'Para ti')+'</h1><p class="message">'+esc(d.message||'')+'</p><div class="gallery">'+photos+'</div>'+(voice?'<h3>🎙️ Tengo algo que decirte</h3><audio controls src="'+esc(voice)+'"></audio>':'')+(video?'<h3>🎬 Una sorpresa más…</h3><video controls playsinline src="'+esc(video)+'"></video>':'')+'<div class="final">'+esc(d.final||'')+'</div>'+(music?'<h3>🎵 Nuestra canción</h3><iframe height="180" src="'+esc(music)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>':'')+'</div></div>'}}
(async()=>{const v=document.getElementById('viewer'),slug=new URLSearchParams(location.search).get('c');if(!slug){v.innerHTML='<div class="error"><h2>Enlace incompleto</h2><p>Falta identificar la cápsula.</p></div>';return}try{let r=await fetch('/api/capsules/'+encodeURIComponent(slug),{cache:'no-store'});if(!r.ok)r=await fetch('/.netlify/functions/capsules/'+encodeURIComponent(slug),{cache:'no-store'});const txt=await r.text();let d;try{d=JSON.parse(txt)}catch{throw new Error('Respuesta inválida del servidor')}if(!r.ok)throw new Error(d.error||'Cápsula no encontrada');render(d)}catch(e){v.innerHTML='<div class="error"><h2>No se pudo abrir la cápsula</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'}})();
</script></body></html>
