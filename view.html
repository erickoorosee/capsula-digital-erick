<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cápsula Digital</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fff8f6,#fff);color:#382b2b;min-height:100vh}.viewer{min-height:100vh}.loading,.error{max-width:680px;margin:8vh auto;padding:24px;border-radius:24px;background:#fff;border:1px solid #f0dfe1;box-shadow:0 12px 35px #8d435214}.bg{min-height:100vh;padding:28px 14px 70px;background:radial-gradient(circle at top,#fff 0,#fff5f7 45%,#fbe8ed 100%)}.bg.dark{background:radial-gradient(circle at top,#3a2630,#171216 65%);color:#fff}.bg.gold{background:radial-gradient(circle at top,#fffaf0,#f3e3bd 60%,#d8b66a);color:#302414}.card{max-width:720px;margin:auto;background:#ffffffdf;border:1px solid #ffffffaa;border-radius:32px;padding:clamp(22px,6vw,48px);box-shadow:0 30px 80px #5d243326;text-align:center}.dark .card{background:#241a20df}.cover{min-height:85vh;display:flex;align-items:center;justify-content:center}.icon{font-size:64px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800;opacity:.65}.title{font-family:Georgia,serif;font-size:clamp(38px,10vw,72px);margin:14px 0}.envelope{width:min(330px,88vw);height:210px;margin:25px auto;background:#f7d7df;border-radius:10px;box-shadow:0 25px 60px #5d24332b;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Georgia,serif;font-size:28px;transition:.35s}.envelope:active{transform:scale(.96)}.message{font-size:20px;line-height:1.75}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:28px 0}.gallery img{width:100%;height:260px;object-fit:cover;border-radius:18px}.gallery img:nth-child(3n+1){grid-column:1/-1;height:min(56vh,460px)}.final{font-family:Georgia,serif;font-size:clamp(26px,6vw,38px);line-height:1.45;margin:38px auto 20px;padding:28px 12px;border-top:1px solid currentColor;border-bottom:1px solid currentColor}audio,video,iframe{width:100%;border-radius:18px;border:0;margin-top:18px}.small{opacity:.7;font-size:13px}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:800;background:#c94d69;color:#fff;cursor:pointer}@media(max-width:560px){.gallery img{height:210px}.card{border-radius:26px;padding:22px 14px}}
.locked{max-width:560px;margin:10vh auto;text-align:center}.countdown{font-weight:900;font-size:clamp(24px,7vw,42px);font-variant-numeric:tabular-nums}.response{margin:28px 0;padding:18px;border-radius:20px;background:#ffffff88}.response textarea{width:100%;min-height:100px;border:1px solid #ead9dd;border-radius:14px;padding:12px;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.ghost{background:#fff0f3;color:#c94d69}.qr-card{margin:32px auto 4px;max-width:360px;padding:26px 20px 22px;border-radius:28px;background:linear-gradient(145deg,#fff,#fff6f8);border:1px solid #f1dfe4;box-shadow:0 18px 48px #5d24331c;text-align:center}.dark .qr-card{background:linear-gradient(145deg,#30232a,#1f171c);border-color:#ffffff18}.gold .qr-card{background:linear-gradient(145deg,#fffdf6,#f8ebc9);border-color:#c9a85c55}.qr-wrap{width:210px;height:210px;margin:16px auto;padding:12px;border-radius:24px;background:#fff;box-shadow:0 10px 28px #5d243322;display:flex;align-items:center;justify-content:center}.qr{width:186px;height:186px;display:block}.qr-title{font-family:Georgia,serif;font-size:28px;margin:6px 0 8px}.qr-note{font-size:14px;line-height:1.6;opacity:.76;margin:0 auto 16px;max-width:290px}.qr-message{font-family:Georgia,serif;font-size:19px;line-height:1.5;margin:10px auto 4px;max-width:300px}.qr-divider{width:54px;height:1px;background:currentColor;opacity:.18;margin:14px auto}.qr-kicker{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:900;opacity:.52}.qr-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.qr-actions .btn{font-size:13px;padding:10px 14px}.photo-error{display:none!important}</style></head>
<body><main id="viewer" class="viewer"><div class="loading"><h2>Abriendo tu cápsula…</h2><p class="small">Un momento ✨</p></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safe=u=>/^https:\/\//i.test(String(u||'').trim())?String(u).trim():'';
function yt(url){const s=String(url||'');const m=s.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{6,})/);if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?playsinline=1&rel=0';const sp=s.match(/open\.spotify\.com\/(track|episode)\/([A-Za-z0-9]+)/i);return sp?'https://open.spotify.com/embed/'+sp[1].toLowerCase()+'/'+sp[2]:''}
function occasion(d){const o=String(d.occasion||'').toLowerCase(),e=String(d.experience||'');if(e==='proposal'||o.includes('propuesta'))return['💍','Tengo algo muy importante para ti','Hay una pregunta que puede cambiarlo todo'];if(e==='birthday'||o.includes('cumple'))return['🎂','Hay una sorpresa para ti','Hoy el mundo celebra que existes'];if(o.includes('aniversario'))return['🥂','Nuestra historia merece celebrarse','Un recuerdo de todo lo que hemos vivido'];return['❤️','Tienes algo especial',d.occasion||'Un momento especial']}
function countdown(el,until){const end=new Date(until).getTime();const tick=()=>{const n=Math.max(0,end-Date.now()),days=Math.floor(n/86400000),h=Math.floor(n/3600000)%24,m=Math.floor(n/60000)%60,s=Math.floor(n/1000)%60;el.textContent=days+'d '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(n>0)setTimeout(tick,1000);else location.reload()};tick()}
function render(d){const v=document.getElementById('viewer'),theme=['dark','gold'].includes(d.theme)?d.theme:'',o=occasion(d);if(d.unlockAt&&Date.now()<new Date(d.unlockAt).getTime()){v.innerHTML='<div class="bg '+theme+'"><div class="card locked"><div class="icon">🔐</div><h1>Todavía no es momento</h1><p>Esta cápsula se abrirá en el momento indicado.</p><div id="countdown" class="countdown"></div></div></div>';countdown(document.getElementById('countdown'),d.unlockAt);return}if(d.secret&&!sessionStorage.getItem('capsule-unlocked-'+d.slug)){v.innerHTML='<div class="bg '+theme+'"><div class="card locked"><div class="icon">🔐</div><h1>Cápsula secreta</h1><p>Escribe la palabra especial para abrirla.</p><input id="secretTry" type="password" style="width:100%;padding:13px;border:1px solid #ead9dd;border-radius:14px" placeholder="Palabra secreta"><button class="btn" id="secretOpen" style="margin-top:12px">Desbloquear ✦</button><p id="secretMsg" class="small"></p></div></div>';document.getElementById('secretOpen').onclick=()=>{if(document.getElementById('secretTry').value.trim().toLowerCase()===String(d.secret).trim().toLowerCase()){sessionStorage.setItem('capsule-unlocked-'+d.slug,'1');render(d)}else document.getElementById('secretMsg').textContent='Esa no es la palabra. Intenta otra vez.'};return}v.innerHTML='<div class="bg '+theme+'"><div class="cover"><div><div class="icon">'+o[0]+'</div><p class="eyebrow">'+esc(o[2])+'</p><h1 class="title">'+esc(o[1])+'</h1><div class="envelope" id="open">'+esc(d.name||'Para ti')+'</div><p class="small">Toca el sobre para abrir tu sorpresa ✦</p></div></div></div>';
document.getElementById('open').onclick=()=>{const photos=(d.photos||[]).map(x=>'<img src="'+esc(x)+'" alt="Recuerdo" loading="lazy">').join(''),music=yt(d.music),voice=safe(d.voice),video=safe(d.video);v.innerHTML='<div class="bg '+theme+'"><div class="card"><p class="eyebrow">'+esc(d.occasion||'')+'</p><p class="small">'+esc(d.date||'')+'</p><h1 class="title">'+esc(d.name||'Para ti')+'</h1><p class="message">'+esc(d.message||'')+'</p><div class="gallery">'+photos+'</div>'+(voice?'<h3>🎙️ Tengo algo que decirte</h3><audio controls preload="metadata" src="'+esc(voice)+'"></audio>':'')+(video?'<h3>🎬 Una sorpresa más…</h3><video controls playsinline preload="metadata" src="'+esc(video)+'"></video>':'')+'<div class="final">'+esc(d.final||'')+'</div>'+(d.reveal?'<div class="final">'+esc(d.reveal)+'</div>':'')+(music?'<h3>🎵 Nuestra canción</h3><iframe height="180" src="'+esc(music)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>':'')+'<div class="response"><h3>💌 Deja una respuesta</h3><textarea id="reply" placeholder="Escribe lo que sentiste…"></textarea><button class="btn" id="sendReply">Guardar respuesta ♡</button><p class="small" id="replyStatus"></p></div><div class="response"><h3>¿Qué te hizo sentir? ❤️</h3><div class="row"><button class="btn ghost react" data-r="😍 Me encantó">😍 Me encantó</button><button class="btn ghost react" data-r="🥹 Me hiciste llorar">🥹 Me hiciste llorar</button><button class="btn ghost react" data-r="❤️ Te amo">❤️ Te amo</button><button class="btn ghost react" data-r="🫶 Gracias">🫶 Gracias</button></div><p class="small" id="reactionStatus"></p></div><div><h3>Guarda esta cápsula</h3><img class="qr" alt="Código QR" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(location.href)+'"></div></div></div>';document.getElementById('copyCapsuleLink').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('qrStatus').textContent='Enlace copiado ✓'}catch{document.getElementById('qrStatus').textContent='No se pudo copiar el enlace.'}};document.getElementById('shareCapsule').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Cápsula Digital',url:location.href});else{await navigator.clipboard.writeText(location.href);document.getElementById('qrStatus').textContent='Enlace copiado para compartir ✓'}}catch(e){if(e.name!=='AbortError')document.getElementById('qrStatus').textContent='No se pudo compartir.'}};document.querySelectorAll('.gallery img').forEach(img=>img.onerror=()=>img.classList.add('photo-error'));document.querySelectorAll('.react').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/api/capsules/'+encodeURIComponent(d.slug)+'/reaction',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reaction:b.dataset.r})});if(!r.ok)throw Error();document.getElementById('reactionStatus').textContent='Tu reacción fue enviada '+b.dataset.r}catch{document.getElementById('reactionStatus').textContent='No se pudo enviar la reacción.'}});document.getElementById('sendReply').onclick=async()=>{const message=document.getElementById('reply').value.trim();if(!message)return;try{const r=await fetch('/api/capsules/'+encodeURIComponent(d.slug)+'/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});if(!r.ok)throw Error();document.getElementById('replyStatus').textContent='Respuesta enviada ♡';document.getElementById('reply').value=''}catch{document.getElementById('replyStatus').textContent='No se pudo enviar. Intenta otra vez.'}}}}
(async()=>{const v=document.getElementById('viewer'),slug=new URLSearchParams(location.search).get('c');if(!slug){v.innerHTML='<div class="error"><h2>Enlace incompleto</h2><p>Falta identificar la cápsula.</p></div>';return}try{let r=await fetch('/api/capsules/'+encodeURIComponent(slug),{cache:'no-store'});if(!r.ok)r=await fetch('/.netlify/functions/capsules/'+encodeURIComponent(slug),{cache:'no-store'});const txt=await r.text();let d;try{d=JSON.parse(txt)}catch{throw new Error('Respuesta inválida del servidor')}if(!r.ok)throw new Error(d.error||'Cápsula no encontrada');render(d)}catch(e){v.innerHTML='<div class="error"><h2>No se pudo abrir la cápsula</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'}})();
</script></body></html>
