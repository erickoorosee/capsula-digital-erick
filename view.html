let customerRecordedVideo=null,customerVideoRecorder=null,customerVideoChunks=[],customerUploadedVideoUrl='';function videoProgress(p,msg){const w=$('#videoProgressWrap'),bar=$('#videoProgressBar'),txt=$('#videoProgressText');w.classList.remove('hide');bar.style.width=Math.max(0,Math.min(100,p))+'%';txt.textContent=msg||('Subiendo video… '+p+'%')}$('#oVideoFile').onchange=async()=>{const f=$('#oVideoFile').files[0];customerRecordedVideo=null;customerUploadedVideoUrl='';if(!f){$('#videoSelected').textContent='';$('#videoProgressWrap').classList.add('hide');return}$('#videoSelected').textContent='✓ Video seleccionado: '+f.name+' · '+(f.size/1024/1024).toFixed(1)+' MB';if(f.size>20*1024*1024){videoProgress(0,'El video supera 20 MB. Elige uno más pequeño.');return}try{customerUploadedVideoUrl=await uploadCustomerVideo($('#videoProgressText'));$('#videoSelected').textContent='✅ Video cargado: '+f.name+' · '+(f.size/1024/1024).toFixed(1)+' MB'}catch(e){videoProgress(0,'No se pudo subir: '+e.message)}};async function uploadCustomerVideo(st){if(customerUploadedVideoUrl)return customerUploadedVideoUrl;const f=customerRecordedVideo||$('#oVideoFile')?.files?.[0];if(!f)return $('#oVideo').value.trim();if(f.size>20*1024*1024)throw Error('El video supera 20 MB.');const uploadId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2),chunkSize=1024*1024,total=Math.ceil(f.size/chunkSize),type=f.type||'video/mp4';videoProgress(1,'Iniciando subida…');for(let i=0;i<total;i++){const pct=Math.round((i/total)*100);st.textContent='Subiendo video… '+pct+'%';videoProgress(pct,'Subiendo video… '+pct+'%');const part=f.slice(i*chunkSize,Math.min(f.size,(i+1)*chunkSize)),dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(part)});await apiJson('/order-video-chunk',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({uploadId,index:i,total,type,dataUrl})}) $('#oRecordVideo').onclick=async()=>{if(customerVideoRecorder&&customerVideoRecorder.state==='recording'){customerVideoRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});customerVideoChunks=[];customerVideoRecorder=new MediaRecorder(stream);customerVideoRecorder.ondataavailable=e=>{if(e.data.size)customerVideoChunks.push(e.data)};customerVideoRecorder.onstop=()=>{customerRecordedVideo=new Blob(customerVideoChunks,{type:customerVideoRecorder.mimeType||'video/webm'});customerUploadedVideoUrl='';stream.getTracks().forEach(t=>t.stop());$('#oVideoRecordStatus').textContent='✓ Video grabado y listo · '+(customerRecordedVideo.size/1024/1024).toFixed(1)+' MB';videoProgress(0,'Video grabado. Se subirá cuando continúes con el pedido.');$('#oRecordVideo').textContent='📹 Grabar de nuevo'};customerVideoRecorder.start();$('#oRecordVideo').textContent='⏹️ Detener grabación';$('#oVideoRecordStatus').textContent='Grabando video…'}catch(e){$('#oVideoRecordStatus').textContent='No se pudo acceder a la cámara. Puedes subir un video desde tu celular.'}};

async function optimize(file){const max=1600,draw=(img,w,h)=>{const scale=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*scale));cv.height=Math.max(1,Math.round(h*scale));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.82)};try{const bmp=await createImageBitmap(file);const out=draw(bmp,bmp.width,bmp.height);bmp.close?.();return out}catch(e){return await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const out=draw(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(url);resolve(out)}catch(err){URL.revokeObjectURL(url);reject(err)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('No pudimos leer una de las fotos. Intenta guardarla como JPG o PNG y vuelve a seleccionarla.'))};img.src=url})}}

function revealCinematics(v){requestAnimationFrame(()=>{const els=[...v.querySelectorAll('.cinematic')];if(!('IntersectionObserver' in window)){els.forEach(el=>el.classList.add('show'));return}const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('show');io.unobserve(entry.target)}}),{threshold:.12});els.forEach(el=>io.observe(el))})}
function occasionExperience(d){const o=String(d.occasion||'').toLowerCase(),e=String(d.experience||'');if(e==='proposal'||o.includes('propuesta'))return{cls:'proposal',icon:'💍',eyebrow:'Hay una pregunta que puede cambiarlo todo',title:'Tengo algo muy importante para ti',tap:'Toca el sobre cuando estés listo/a ✦',banner:'Una historia que quiere seguir escribiéndose'};if(e==='birthday'||o.includes('cumple'))return{cls:'birthday',icon:'🎂',eyebrow:'Hoy el mundo celebra que existes',title:'Hay una sorpresa para ti',tap:'Toca el regalo y comienza la celebración ✦',banner:'Feliz cumpleaños ✨'};if(o.includes('aniversario'))return{cls:'anniversary',icon:'🥂',eyebrow:'Un recuerdo de todo lo que hemos vivido',title:'Nuestra historia merece celebrarse',tap:'Toca el sobre para volver a sentirla ♡',banner:'Un capítulo más de nosotros'};if(o.includes('amistad'))return{cls:'friendship',icon:'🫶',eyebrow:'Para alguien que hace la vida más bonita',title:'Esto es para ti',tap:'Toca para descubrir tu sorpresa ✦',banner:'Gracias por estar'};if(o.includes('familia'))return{cls:'family',icon:'🏡',eyebrow:'Hay personas que siempre se sienten como hogar',title:'Un recuerdo hecho para ti',tap:'Toca el sobre para abrirlo ♡',banner:'Donde hay amor, hay hogar'};return{cls:'love',icon:'❤️',eyebrow:d.occasion||'Un momento especial',title:'Tienes algo especial',tap:'Toca el sobre para abrir tu sorpresa ✦',banner:'Hecho con recuerdos que importan'}}

function render(d){const v=document.getElementById('viewer');const theme=['dark','gold'].includes(d.theme)?d.theme:'',exp=d.experience||'cinematic';const unlock=()=>{if(d.unlockAt&&Date.now()<new Date(d.unlockAt).getTime()){v.innerHTML='<div class="viewer-bg '+theme+'"><div class="premium-card locked"><div class="opening-icon">🔐</div><p class="eyebrow">Esta cápsula está viajando hacia un momento especial</p><h1>Todavía no es momento ♡</h1><p>Cuando el contador llegue a cero, tu sorpresa podrá abrirse.</p><div class="countdown" id="countdown"></div></div></div>';startCountdown($('#countdown'),d.unlockAt);return false}if(d.secret&&!sessionStorage.getItem('capsule-unlocked-'+d.slug)){v.innerHTML='<div class="viewer-bg '+theme+'"><div class="premium-card locked"><div class="spark">♡</div><h1>Cápsula secreta</h1><p>Escribe la palabra especial para abrirla.</p><input id="secretTry" type="password" placeholder="Palabra secreta"><button class="btn primary" id="secretOpen" style="margin-top:12px">Desbloquear ✦</button><p class="small" id="secretMsg"></p></div></div>';$('#secretOpen').onclick=()=>{if($('#secretTry').value.trim().toLowerCase()===String(d.secret).trim().toLowerCase()){sessionStorage.setItem('capsule-unlocked-'+d.slug,'1');render(d)}else $('#secretMsg').textContent='Esa no es la palabra. Intenta otra vez.'};return false}return true};if(!unlock())return;const ox=occasionExperience(d);v.innerHTML='<div class="viewer-bg '+theme+' occasion-'+ox.cls+'"><div class="cover"><div class="cover-inner"><div class="opening-icon">'+ox.icon+'</div><p class="eyebrow">'+esc(ox.eyebrow)+'</p><h1 style="font-family:Georgia,serif;font-size:clamp(38px,10vw,72px);margin:14px 0">'+esc(ox.title)+'</h1><div class="envelope" id="open"><div class="envelope-name">'+esc(d.name||'Para ti')+'</div></div><div class="opening-stars">✦ ♡ ✦</div><p class="opening-sub">'+esc(ox.tap)+'</p></div></div></div>';$('#open').onclick=()=>{$('#open').classList.add('opening');hearts();const musicSrc=musicEmbed(d.music,true),voice=safeMediaUrl(d.voice),video=safeMediaUrl(d.video),story=exp==='story'||exp==='proposal'||exp==='birthday';const photos=(d.photos||[]).map((x,i)=>story?'<div class="story-photo cinematic"><img class="photo polaroid" src="'+esc(x)+'" alt="Recuerdo" loading="lazy"><div class="story-caption">'+(i===0?'Aquí comienza esta historia…':i===(d.photos||[]).length-1?'Y todavía quedan recuerdos por crear…':'Un momento que merece quedarse aquí ♡')+'</div></div>':'<img class="photo cinematic polaroid" src="'+esc(x)+'" alt="Recuerdo" loading="lazy">').join('');const timeline=timelineHtml(d.timeline);v.innerHTML='<div class="viewer-bg '+theme+'"><div class="premium-card capsule"><p class="eyebrow">'+esc(d.occasion||'')+'</p><p class="small">'+esc(d.date||'')+'</p><h1 class="capsule-title">'+esc(d.name||'Para ti')+'</h1><div class="occasion-banner cinematic">'+esc(ox.banner)+'</div><p class="cinematic" style="font-size:20px;line-height:1.75">'+esc(d.message)+'</p>'+(timeline?'<div class="timeline cinematic"><h3>Nuestra historia</h3>'+timeline+'</div>':'')+'<div class="gallery">'+photos+'</div>'+(voice?'<div class="voicebox cinematic"><h3>🎙️ Tengo algo que decirte</h3><audio controls preload="metadata" src="'+esc(voice)+'" style="width:100%"></audio></div>':'')+(video?'<div class="videobox cinematic"><h3>🎬 Una sorpresa más…</h3><video controls playsinline preload="metadata" src="'+esc(video)+'" style="width:100%;border-radius:18px"></video></div>':'')+'<div class="finalmsg cinematic">'+esc(d.final)+'</div>'+(d.reveal?'<div class="reveal-final cinematic">'+esc(d.reveal)+'</div>':'')+(musicSrc?'<div class="musicbox cinematic"><iframe width="100%" height="180" style="border:0;border-radius:20px" src="'+esc(musicSrc)+'" title="Nuestra canción" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><p class="small">Si tu teléfono bloquea el sonido automático, toca ▶️.</p></div>':'')+'<div class="responsebox cinematic"><h3>💌 Deja una respuesta</h3><textarea id="recipientReply" placeholder="Escribe lo que sentiste al recibir esta cápsula…"></textarea><div class="row" style="justify-content:center"><button class="btn primary" id="sendReply">Guardar respuesta ♡</button>'+(String(d.whatsapp||'').replace(/\D/g,'')?'<button class="btn ghost" id="replyWhatsApp">💚 Enviar por WhatsApp</button>':'')+'</div><p class="small" id="replyStatus"></p></div><div class="responsebox cinematic"><h3>¿Qué te hizo sentir? ❤️</h3><div class="row" style="justify-content:center"><button class="btn ghost react" data-r="😍 Me encantó">😍 Me encantó</button><button class="btn ghost react" data-r="🥹 Me hiciste llorar">🥹 Me hiciste llorar</button><button class="btn ghost react" data-r="❤️ Te amo">❤️ Te amo</button><button class="btn ghost react" data-r="🫶 Gracias">🫶 Gracias</button></div><p class="small" id="reactionStatus"></p></div><div class="qrbox cinematic"><h3>Guarda esta cápsula</h3><img alt="Código QR" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(location.href)+'"><p class="small">Escanea este QR para volver a este recuerdo.</p></div></div></div>';revealCinematics(v);v.querySelectorAll('.photo').forEach(img=>img.onclick=()=>{const lb=document.createElement('div');lb.className='lightbox';lb.innerHTML='<img src="'+img.src+'" alt="Recuerdo ampliado">';lb.onclick=()=>lb.remove();document.body.appendChild(lb)});v.querySelectorAll('.react').forEach(btn=>btn.onclick=async()=>{try{const rr=await fetch('/api/capsules/'+encodeURIComponent(d.slug)+'/reaction',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reaction:btn.dataset.r})});if(!rr.ok)throw Error();$('#reactionStatus').textContent='Tu reacción fue enviada '+btn.dataset.r}catch(e){$('#reactionStatus').textContent='No se pudo enviar la reacción.'}});const replyWa=$('#replyWhatsApp');if(replyWa)replyWa.onclick=()=>{const phone=String(d.whatsapp||'').replace(/\D/g,'');const msg=$('#recipientReply').value.trim()||'Acabo de abrir la cápsula que me enviaste… 🥹❤️\n\nNo esperaba algo así y de verdad me encantó. Cada detalle, cada recuerdo y cada palabra hicieron que este momento fuera todavía más especial. ✨\n\nGracias por tomarte el tiempo de crear algo tan bonito para mí. Es de esas sorpresas que se guardan en el corazón. ❤️\n\nTe quiero mucho. 🫶';if(phone)window.location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(msg)};$('#sendReply').onclick=async()=>{const msg=$('#recipientReply').value.trim();if(!msg)return;$('#replyStatus').textContent='Enviando…';try{const rr=await fetch('/api/capsules/'+encodeURIComponent(d.slug)+'/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:msg})});if(!rr.ok)throw Error();$('#replyStatus').textContent='Respuesta enviada ♡';$('#recipientReply').value=''}catch(e){$('#replyStatus').textContent='No se pudo enviar. Intenta de nuevo.'}}}}


(async()=>{const slug=new URLSearchParams(location.search).get('c');const v=document.getElementById('viewer');if(!slug){v.innerHTML='<div class="card"><h2>Enlace incompleto</h2></div>';return}try{const r=await fetch('/api/capsules/'+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Cápsula no encontrada');render(d)}catch(e){v.innerHTML='<div class="card"><h2>No se pudo abrir la cápsula</h2><p class="small">'+esc(e.message||'')+'</p></div>'}})();</script></body></html>
