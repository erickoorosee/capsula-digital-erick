<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cápsulas</title><style>
:root{--bg:#fff8f6;--card:#fff;--ink:#382b2b;--muted:#806e6e;--accent:#c94d69;--line:#f0dfe1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fff8f6,#fff);color:var(--ink)}header{padding:26px 18px;text-align:center}.wrap{max-width:980px;margin:auto;padding:0 16px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #8d435214}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:16px;background:#fff}textarea{min-height:100px}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#fff0f3;color:var(--accent)}.row{display:flex;gap:10px;flex-wrap:wrap}.hide{display:none}.hero{text-align:center;padding:70px 20px}.heart{font-size:50px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.13)}}.photo{width:100%;border-radius:22px;margin:12px 0;opacity:0;transform:translateY(20px);animation:rise .8s forwards}.photo:nth-of-type(2){animation-delay:.2s}.photo:nth-of-type(3){animation-delay:.4s}@keyframes rise{to{opacity:1;transform:none}}.capsule{text-align:center;max-width:680px;margin:auto}.capsule h1{font-family:Georgia,serif;font-size:clamp(38px,9vw,70px);margin:10px}.small{color:var(--muted);font-size:13px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.picker{display:block;border:2px dashed var(--line);border-radius:18px;padding:20px;text-align:center;cursor:pointer;background:#fffafb}.picker input{display:none}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.thumb{position:relative}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.thumb button{position:absolute;right:4px;top:4px;border:0;border-radius:999px;width:28px;height:28px;background:#fff;color:var(--accent);font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header><b>♡ Cápsulas Digitales</b><div class="small">Panel de producción + páginas finales</div></header><main class="wrap"><section id="admin"><div class="card"><h2>Nueva cápsula</h2><div class="grid"><div><label>Nombre</label><input id="name" placeholder="Sofía"></div><div><label>Slug / enlace</label><input id="slug" placeholder="sofia-25"></div><div><label>Ocasión</label><select id="occasion"><option>Cumpleaños</option><option>Aniversario</option><option>Amor</option><option>Propuesta</option><option>Amistad</option><option>Familia</option><option>Memorial</option><option>Mensaje especial</option></select></div><div><label>Fecha</label><input id="date" type="date"></div></div><label>Mensaje principal</label><textarea id="message" placeholder="Tengo algo especial para ti..."></textarea><label>Fotos (máximo 8)</label><label class="picker">📷 <b>Seleccionar fotos del celular</b><br><span class="small">JPG, PNG o WebP · se optimizan antes de subir</span><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="thumbs" class="thumbs"></div><label>Música (YouTube)</label><input id="music" placeholder="https://youtube.com/watch?v=..."><label>Mensaje final</label><textarea id="final" placeholder="Y esto apenas comienza... ❤️"></textarea><div class="row" style="margin-top:14px"><button class="btn primary" id="save">Publicar cápsula</button><button class="btn ghost" id="preview">Vista previa</button></div><p id="status" class="small"></p></div><div class="card"><h2>Mis cápsulas</h2><div id="list" class="small">Cargando…</div></div></section><section id="viewer" class="hide"></section></main><script>
const $=s=>document.querySelector(s);const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selectedPhotos=[];
function data(){return {name:$('#name').value.trim(),slug:$('#slug').value.trim(),occasion:$('#occasion').value,date:$('#date').value,message:$('#message').value.trim(),photos:[],music:$('#music').value.trim(),final:$('#final').value.trim(),published:true}}
function drawThumbs(){const t=$('#thumbs');t.innerHTML=selectedPhotos.map((f,i)=>`<div class="thumb"><img src="${URL.createObjectURL(f)}"><button type="button" data-i="${i}">×</button></div>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedPhotos.splice(+b.dataset.i,1);drawThumbs()})}
$('#photos').onchange=e=>{selectedPhotos=[...selectedPhotos,...e.target.files].slice(0,8);e.target.value='';drawThumbs()};
async function optimize(file){const bmp=await createImageBitmap(file);const max=1600,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
async function uploadPhotos(){const urls=[];for(let i=0;i<selectedPhotos.length;i++){ $('#status').textContent=`Subiendo foto ${i+1} de ${selectedPhotos.length}…`;const dataUrl=await optimize(selectedPhotos[i]);const r=await fetch('/api/capsules/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dataUrl})});const j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo subir una foto');urls.push(j.url)}return urls}
function render(d){$('#admin').classList.add('hide');const v=$('#viewer');v.classList.remove('hide');v.innerHTML=`<div class="hero capsule"><div class="heart">♡</div><p>${esc(d.occasion)}</p><h1>${esc(d.name||'Para ti')}</h1><p>${esc(d.message)}</p><button class="btn primary" id="open">Abrir mi sorpresa</button></div>`;$('#open').onclick=()=>{v.innerHTML=`<div class="capsule card"><p class="small">${esc(d.date||'')}</p><h1>${esc(d.name||'Para ti')}</h1><p style="font-size:20px;line-height:1.7">${esc(d.message)}</p>${(d.photos||[]).map(x=>`<img class="photo" src="${esc(x)}" alt="Recuerdo">`).join('')}<p style="font-size:24px;font-family:Georgia,serif">${esc(d.final)}</p>${d.music?`<a class="btn ghost" href="${esc(d.music)}" target="_blank" rel="noopener">♫ Escuchar nuestra canción</a>`:''}</div>`}}
async function load(){try{const r=await fetch('/api/capsules');const a=await r.json();$('#list').innerHTML=a.length?a.map(d=>`<div class="item"><span><b>${esc(d.name)}</b><br><span class="small">${esc(d.occasion)} · /?c=${esc(d.slug)}</span></span><a class="btn ghost" href="/?c=${encodeURIComponent(d.slug)}">Abrir</a></div>`).join(''):'Aún no hay cápsulas.'}catch(e){$('#list').textContent='El almacenamiento se activará al desplegar esta versión con Functions.'}}
$('#save').onclick=async()=>{const d=data();if(!d.name){$('#status').textContent='Escribe el nombre.';return}$('#status').textContent='Preparando…';try{d.photos=await uploadPhotos();$('#status').textContent='Publicando…';const r=await fetch('/api/capsules',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');$('#slug').value=j.slug;$('#status').innerHTML=`Publicada: <a href="/?c=${encodeURIComponent(j.slug)}">abrir enlace</a>`;load()}catch(e){$('#status').textContent='No se pudo publicar: '+e.message}};
$('#preview').onclick=async()=>{const d=data();d.photos=selectedPhotos.map(f=>URL.createObjectURL(f));render(d)};
(async()=>{const c=new URLSearchParams(location.search).get('c');if(c){try{const r=await fetch('/api/capsules/'+encodeURIComponent(c));if(r.ok)return render(await r.json())}catch(e){} $('#admin').classList.add('hide');$('#viewer').classList.remove('hide');$('#viewer').innerHTML='<div class="card"><h2>Cápsula no encontrada</h2></div>'}else load()})();
</script></body></html>
