<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cápsulas</title><style>
:root{--bg:#fff8f6;--card:#fff;--ink:#382b2b;--muted:#806e6e;--accent:#c94d69;--line:#f0dfe1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fff8f6,#fff);color:var(--ink)}header{padding:26px 18px;text-align:center}.wrap{max-width:980px;margin:auto;padding:0 16px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #8d435214}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:16px;background:#fff}textarea{min-height:100px}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#fff0f3;color:var(--accent)}.row{display:flex;gap:10px;flex-wrap:wrap}.hide{display:none}.hero{text-align:center;padding:70px 20px}.heart{font-size:50px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.13)}}.photo{width:100%;border-radius:22px;margin:12px 0;opacity:0;transform:translateY(20px);animation:rise .8s forwards}.photo:nth-of-type(2){animation-delay:.2s}.photo:nth-of-type(3){animation-delay:.4s}@keyframes rise{to{opacity:1;transform:none}}.capsule{text-align:center;max-width:680px;margin:auto}.capsule h1{font-family:Georgia,serif;font-size:clamp(38px,9vw,70px);margin:10px}.small{color:var(--muted);font-size:13px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.picker{display:block;border:2px dashed var(--line);border-radius:18px;padding:20px;text-align:center;cursor:pointer;background:#fffafb}.picker input{display:none}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.thumb{position:relative}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.thumb button{position:absolute;right:4px;top:4px;border:0;border-radius:999px;width:28px;height:28px;background:#fff;color:var(--accent);font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}
.theme{margin:8px 0 16px}.viewer-bg{min-height:100vh;padding:28px 14px 70px;background:radial-gradient(circle at top,#fff 0,#fff5f7 45%,#fbe8ed 100%)}.viewer-bg.dark{background:radial-gradient(circle at top,#3a2630,#171216 65%);color:#fff}.viewer-bg.gold{background:radial-gradient(circle at top,#fffaf0,#f3e3bd 60%,#d8b66a);color:#302414}.premium-card{max-width:720px;margin:auto;background:#ffffffd9;backdrop-filter:blur(14px);border:1px solid #ffffffaa;border-radius:32px;padding:clamp(22px,6vw,48px);box-shadow:0 30px 80px #5d243326}.dark .premium-card{background:#241a20df;border-color:#ffffff18}.gold .premium-card{background:linear-gradient(145deg,#fffdf7ed,#fff6dced);border:1px solid #c9a85c66;box-shadow:0 28px 80px #6f521d35}.gold .eyebrow{color:#87641d}.gold .finalmsg{color:#5f4617}.gold .photo{box-shadow:0 14px 34px #6d501f38}.cover{min-height:78vh;display:flex;align-items:center;justify-content:center;text-align:center}.cover-inner{max-width:620px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:12px;font-weight:800;opacity:.65}.spark{font-size:64px;animation:pulse 1.7s infinite}.openbtn{font-size:17px;padding:16px 28px;box-shadow:0 12px 28px #c94d6940}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:28px 0}.gallery .photo{width:100%;height:clamp(180px,42vw,300px);object-fit:cover;margin:0;border-radius:20px;box-shadow:0 12px 30px #3b202018}.gallery .photo:first-child:last-child{grid-column:1/-1;height:min(62vh,520px);object-fit:cover}.gallery .photo:nth-child(3n+1){grid-column:1/-1;height:min(56vh,460px)}.finalmsg{font-family:Georgia,serif;font-size:clamp(26px,6vw,38px);line-height:1.45;margin:38px auto 20px;max-width:560px;padding:28px 12px;border-top:1px solid currentColor;border-bottom:1px solid currentColor}.musicbox{margin-top:22px}.float-heart{position:fixed;bottom:-40px;pointer-events:none;z-index:5;animation:floatUp 4.5s ease-in forwards;opacity:.55}@keyframes floatUp{to{transform:translateY(-115vh) rotate(20deg);opacity:0}}@media(max-width:560px){.gallery{grid-template-columns:repeat(2,1fr);gap:8px}.gallery .photo{height:210px}.gallery .photo:first-child:last-child,.gallery .photo:nth-child(3n+1){grid-column:1/-1;height:min(58vh,430px)}.premium-card{border-radius:26px;padding:22px 14px}.finalmsg{margin-top:30px}}.login{max-width:430px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 24px 70px #6b35451f;text-align:center}.login h2{font-family:Georgia,serif;font-size:34px;margin:8px}.login input{margin:14px 0}.lock{font-size:42px}.adminbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.manage-actions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:9px 12px;font-size:13px}.danger{background:#fff0f0;color:#a52a3a}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff0f3;color:var(--accent);font-size:11px;font-weight:800;margin-top:4px}</style></head><body><header><b>♡ Cápsulas Digitales</b><div class="small">Panel de producción + páginas finales</div></header><main class="wrap"><section id="login" class="login"><div class="lock">♢</div><h2>Panel privado</h2><p class="small">Acceso exclusivo de administración</p><input id="adminPass" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn primary" id="loginBtn">Entrar</button><p id="loginStatus" class="small"></p></section><section id="admin" class="hide"><div class="adminbar"><div><b>Administración</b><div class="small">Cápsulas Digitales</div></div><button class="btn ghost mini" id="logout">Cerrar sesión</button></div><div class="card"><h2 id="formTitle">Nueva cápsula</h2><div class="grid"><div><label>Nombre</label><input id="name" placeholder="Sofía"></div><div><label>Slug / enlace</label><input id="slug" placeholder="sofia-25"></div><div><label>Ocasión</label><select id="occasion"><option>Cumpleaños</option><option>Aniversario</option><option>Amor</option><option>Propuesta</option><option>Amistad</option><option>Familia</option><option>Memorial</option><option>Mensaje especial</option></select></div><div><label>Fecha</label><input id="date" type="date"></div></div><label>Mensaje principal</label><textarea id="message" placeholder="Tengo algo especial para ti..."></textarea><label>Fotos (máximo 8)</label><label class="picker">📷 <b>Seleccionar fotos del celular</b><br><span class="small">JPG, PNG o WebP · se optimizan antes de subir</span><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="thumbs" class="thumbs"></div><label>Música (YouTube)</label><input id="music" placeholder="https://youtube.com/watch?v=..."><label>Estilo de la cápsula</label><select id="theme" class="theme"><option value="romantic">Romántico</option><option value="dark">Noche elegante</option><option value="gold">Dorado premium</option></select><label>Mensaje final</label><textarea id="final" placeholder="Y esto apenas comienza... ❤️"></textarea><div class="row" style="margin-top:14px"><button class="btn primary" id="save">Publicar cápsula</button><button class="btn ghost" id="preview">Vista previa</button></div><p id="status" class="small"></p></div><div class="card"><h2>Mis cápsulas</h2><div id="list" class="small">Cargando…</div></div></section><section id="viewer" class="hide"></section></main><script>
const $=s=>document.querySelector(s);let adminPass=sessionStorage.getItem('capsuleAdmin')||'';const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let selectedPhotos=[];
function data(){return {name:$('#name').value.trim(),slug:$('#slug').value.trim(),occasion:$('#occasion').value,date:$('#date').value,message:$('#message').value.trim(),photos:[],music:$('#music').value.trim(),final:$('#final').value.trim(),theme:$('#theme').value,published:true}}
function drawThumbs(){const t=$('#thumbs');t.innerHTML=selectedPhotos.map((f,i)=>`<div class="thumb"><img src="${URL.createObjectURL(f)}"><button type="button" data-i="${i}">×</button></div>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedPhotos.splice(+b.dataset.i,1);drawThumbs()})}
$('#photos').onchange=e=>{selectedPhotos=[...selectedPhotos,...e.target.files].slice(0,8);e.target.value='';drawThumbs()};
async function optimize(file){const bmp=await createImageBitmap(file);const max=1600,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
async function uploadPhotos(){const urls=[];for(let i=0;i<selectedPhotos.length;i++){ $('#status').textContent=`Subiendo foto ${i+1} de ${selectedPhotos.length}…`;const dataUrl=await optimize(selectedPhotos[i]);const r=await fetch('/api/capsules/upload',{method:'POST',headers:{'content-type':'application/json','x-admin-password':adminPass},body:JSON.stringify({dataUrl})});const j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo subir una foto');urls.push(j.url)}return urls}
function youtubeId(url){const m=String(url||'').match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:''}
function hearts(){for(let i=0;i<12;i++)setTimeout(()=>{const h=document.createElement('div');h.className='float-heart';h.textContent=Math.random()>.45?'♡':'✦';h.style.left=Math.random()*95+'vw';h.style.fontSize=(16+Math.random()*24)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),4800)},i*130)}
function render(d){$('#admin').classList.add('hide');document.querySelector('header').classList.add('hide');const v=$('#viewer');v.classList.remove('hide');const theme=['dark','gold'].includes(d.theme)?d.theme:'';v.innerHTML=`<div class="viewer-bg ${theme}"><div class="cover"><div class="cover-inner"><div class="spark">♡</div><p class="eyebrow">${esc(d.occasion||'Un momento especial')}</p><h1 style="font-family:Georgia,serif;font-size:clamp(46px,12vw,86px);margin:14px 0">${esc(d.name||'Para ti')}</h1><p style="font-size:20px;line-height:1.6">${esc(d.message)}</p><button class="btn primary openbtn" id="open">Abrir mi sorpresa ✦</button></div></div></div>`;$('#open').onclick=()=>{hearts();const y=youtubeId(d.music);v.innerHTML=`<div class="viewer-bg ${theme}"><div class="premium-card capsule"><p class="eyebrow">${esc(d.occasion||'')}</p><p class="small">${esc(d.date||'')}</p><h1>${esc(d.name||'Para ti')}</h1><p style="font-size:20px;line-height:1.75">${esc(d.message)}</p><div class="gallery">${(d.photos||[]).map(x=>`<img class="photo" src="${esc(x)}" alt="Recuerdo" loading="lazy">`).join('')}</div><div class="finalmsg">${esc(d.final)}</div>${y?`<div class="musicbox"><iframe width="100%" height="180" style="border:0;border-radius:20px" src="https://www.youtube-nocookie.com/embed/${y}" title="Nuestra canción" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`:d.music?`<a class="btn ghost" href="${esc(d.music)}" target="_blank" rel="noopener">♫ Escuchar nuestra canción</a>`:''}</div></div>`}}

async function load(){try{const r=await fetch('/api/capsules',{headers:{'x-admin-password':adminPass}});const a=await r.json();$('#list').innerHTML=a.length?a.map(d=>`<div class="item"><span><b>${esc(d.name)}</b><br><span class="small">${esc(d.occasion)} · ${d.updatedAt?new Date(d.updatedAt).toLocaleDateString('es-MX'):''}</span><br><span class="badge">${esc(d.theme||'romantic')}</span></span><span class="manage-actions"><button class="btn ghost mini" onclick="copyLink('${encodeURIComponent(d.slug)}')">Copiar enlace</button><a class="btn ghost mini" href="/?c=${encodeURIComponent(d.slug)}">Abrir</a><button class="btn danger mini" onclick="removeCapsule('${encodeURIComponent(d.slug)}','${esc(d.name).replace(/'/g,'&#39;')}')">Eliminar</button></span></div>`).join(''):'Aún no hay cápsulas.'}catch(e){$('#list').textContent='El almacenamiento se activará al desplegar esta versión con Functions.'}}
window.copyLink=async slug=>{const url=location.origin+'/?c='+slug;try{await navigator.clipboard.writeText(url);$('#status').textContent='Enlace copiado ✓'}catch(e){prompt('Copia este enlace:',url)}};
window.removeCapsule=async(slug,name)=>{if(!confirm('¿Eliminar la cápsula de '+name+'? Esta acción no se puede deshacer.'))return;try{const r=await fetch('/api/capsules/'+slug,{method:'DELETE',headers:{'x-admin-password':adminPass}});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');$('#status').textContent='Cápsula eliminada.';load()}catch(e){$('#status').textContent='No se pudo eliminar: '+e.message}};
$('#logout').onclick=()=>{sessionStorage.removeItem('capsuleAdmin');adminPass='';$('#admin').classList.add('hide');$('#login').classList.remove('hide');$('#adminPass').value=''};
$('#save').onclick=async()=>{const d=data();if(!d.name){$('#status').textContent='Escribe el nombre.';return}$('#status').textContent='Preparando…';try{d.photos=await uploadPhotos();$('#status').textContent='Publicando…';const r=await fetch('/api/capsules',{method:'POST',headers:{'content-type':'application/json','x-admin-password':adminPass},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');$('#slug').value=j.slug;$('#status').innerHTML=`Publicada: <a href="/?c=${encodeURIComponent(j.slug)}">abrir enlace</a>`;load()}catch(e){$('#status').textContent='No se pudo publicar: '+e.message}};
async function doLogin(){const p=$('#adminPass').value;$('#loginStatus').textContent='Verificando…';try{const r=await fetch('/api/capsules/login',{method:'POST',headers:{'x-admin-password':p}});if(!r.ok)throw Error('Contraseña incorrecta');adminPass=p;sessionStorage.setItem('capsuleAdmin',p);$('#login').classList.add('hide');$('#admin').classList.remove('hide');$('#loginStatus').textContent='';load()}catch(e){$('#loginStatus').textContent='Contraseña incorrecta'}}
$('#loginBtn').onclick=doLogin;$('#adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#preview').onclick=async()=>{const d=data();d.photos=selectedPhotos.map(f=>URL.createObjectURL(f));render(d)};
(async()=>{const c=new URLSearchParams(location.search).get('c');if(c){$('#login').classList.add('hide');try{const r=await fetch('/api/capsules/'+encodeURIComponent(c));if(r.ok)return render(await r.json())}catch(e){} $('#admin').classList.add('hide');$('#viewer').classList.remove('hide');$('#viewer').innerHTML='<div class="card"><h2>Cápsula no encontrada</h2></div>'}else{if(adminPass){try{const r=await fetch('/api/capsules/login',{method:'POST',headers:{'x-admin-password':adminPass}});if(r.ok){$('#login').classList.add('hide');$('#admin').classList.remove('hide');return load()}}catch(e){}sessionStorage.removeItem('capsuleAdmin');adminPass=''}$('#login').classList.remove('hide')}})();
</script></body></html>
