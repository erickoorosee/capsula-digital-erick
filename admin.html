<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador · Cápsulas Digitales</title><style>body{margin:0;background:#fff7f9;color:#382b2b;font-family:system-ui,-apple-system,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);box-sizing:border-box;background:#fff;padding:34px 24px;border-radius:28px;box-shadow:0 18px 55px #8d435225;text-align:center}h1{font-family:Georgia,serif;margin:8px 0 6px}.small{color:#806e6e}.lock{font-size:44px}.input{width:100%;box-sizing:border-box;padding:15px 16px;border:1px solid #e4ccd2;border-radius:14px;font-size:16px;margin:18px 0 12px}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#c94d69;color:white}.status{min-height:24px;margin-top:12px}.hide{display:none}.ok{font-size:44px}.link{display:block;margin-top:16px;color:#9b3850}</style></head><body><div class="wrap"><div class="card" id="login"><div class="lock">♢</div><h1>Panel privado</h1><p class="small">Acceso exclusivo de administración</p><input class="input" id="pass" type="password" placeholder="Contraseña" autocomplete="off"><button class="btn" id="enter" type="button">Entrar</button><p class="small status" id="status"></p><a class="link" href="/">Volver a la página</a></div><div class="card hide" id="ok"><div class="ok">✓</div><h1>Acceso correcto</h1><p>Abriendo administración…</p></div></div><script>const pass=document.getElementById('pass'),status=document.getElementById('status'),btn=document.getElementById('enter');async function login(){const p=pass.value;if(!p){status.textContent='Escribe la contraseña.';return}btn.disabled=true;status.textContent='Verificando…';try{const r=await fetch('/api/capsules/login',{method:'POST',headers:{'x-admin-password':p},cache:'no-store'});if(!r.ok)throw new Error('Contraseña incorrecta');sessionStorage.setItem('capsuleAdmin',p);document.getElementById('login').classList.add('hide');document.getElementById('ok').classList.remove('hide');const token=btoa(unescape(encodeURIComponent(p)));location.replace('/?admin=1&auth='+encodeURIComponent(token))}catch(e){status.textContent=e.message||'No se pudo iniciar sesión.';btn.disabled=false}}btn.addEventListener('click',login);pass.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});</script></body></html>
