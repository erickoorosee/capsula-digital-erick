<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración · Cápsulas Digitales</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0e0b12;color:#f8f3f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);background:#17121d;border:1px solid #352b3e;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0008;text-align:center}
.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#cdbed6}.lock{font-size:42px;margin:10px}h1{font-size:25px;margin:8px 0}p{color:#bdb2c4}
input,button{width:100%;border-radius:14px;padding:15px 16px;font-size:16px}input{border:1px solid #4a3b54;background:#0f0c13;color:#fff;margin:12px 0}button{border:0;background:#f4d7e7;color:#241722;font-weight:800;cursor:pointer}button:disabled{opacity:.65}
#status{min-height:24px;margin:12px 0 0}.ok{color:#a8e6b1}.err{color:#ffb4b4}
</style></head>
<body><main class="card"><div class="brand">Cápsulas Digitales</div><div class="lock">♢</div><h1>Panel privado</h1><p>Acceso exclusivo de administración</p>
<input id="pass" type="password" placeholder="Contraseña" autocomplete="off" autocapitalize="none" spellcheck="false">
<button id="enter" type="button">Entrar</button><p id="status"></p></main>
<script>
(function(){
 var pass=document.getElementById('pass'),btn=document.getElementById('enter'),st=document.getElementById('status');
 function go(){
  var p=pass.value;
  if(!p){st.className='err';st.textContent='Escribe la contraseña.';return}
  btn.disabled=true;st.className='';st.textContent='Verificando…';
  fetch('/api/capsules/login',{method:'POST',headers:{'x-admin-password':p},cache:'no-store'})
   .then(function(r){if(!r.ok)throw new Error('Contraseña incorrecta');return r.json()})
   .then(function(){sessionStorage.setItem('capsuleAdmin',p);st.className='ok';st.textContent='Acceso correcto. Abriendo panel…';window.location.assign('/dashboard.html?v=66')})
   .catch(function(e){st.className='err';st.textContent=e.message||'No se pudo iniciar sesión.';btn.disabled=false});
 }
 btn.onclick=go;
 pass.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();go()}};
})();
</script></body></html>
