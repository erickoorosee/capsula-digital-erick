<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Medic In Campañas</title>
<style>
:root{--bg:#0b141a;--card:#111b21;--soft:#202c33;--green:#25d366;--text:#f0f2f5;--muted:#8696a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:10;padding:18px;background:linear-gradient(180deg,#075e54,#0b141a);box-shadow:0 4px 18px #0007}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:var(--green);display:grid;place-items:center;font-size:25px}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#d7f7e3;margin-top:3px}main{padding:16px;max-width:760px;margin:auto;padding-bottom:100px}.card{background:var(--card);border:1px solid #22313a;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0003}label{display:block;font-size:13px;color:#aebac1;margin:12px 0 7px}input,textarea,select{width:100%;border:1px solid #2a3942;border-radius:12px;background:#0d171d;color:var(--text);padding:12px 13px;font-size:15px;outline:none}textarea{min-height:160px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--soft);color:var(--text)}button.primary{background:var(--green);color:#062c1a;flex:1;min-width:180px}button.secondary{background:#1f3b3a}.small{padding:9px 11px;font-size:12px}.list{display:grid;gap:8px;margin-top:10px}.item{background:#0d171d;border:1px solid #26343c;border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{display:block}.item span{font-size:12px;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#173c33;color:#9af0c0;font-size:11px}.empty{font-size:13px;color:var(--muted);text-align:center;padding:14px}nav{position:fixed;bottom:0;left:0;right:0;background:#111b21;border-top:1px solid #26343c;padding:9px 12px max(9px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:20}nav button{flex:1;max-width:220px}.count{font-size:12px;color:var(--muted);margin-top:7px}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head><body>
<header><div class="brand"><div class="logo">💬</div><div><h1>Medic In Campañas</h1><div class="sub">Campañas rápidas para WhatsApp</div></div></div></header>
<main>
<section class="card"><span class="badge">Nueva campaña</span><label>Título</label><input id="title" placeholder="Ej. Muestras a domicilio"><div class="row"><div><label>Categoría</label><select id="category"><option>Laboratorio</option><option>Farmacia</option><option>Consultorio</option><option>Muestras a domicilio</option><option>Promoción</option><option>Otro</option></select></div><div><label>Grupo o segmento</label><input id="group" placeholder="Ej. Grupos Tianguistenco"></div></div><label>Mensaje</label><textarea id="message" placeholder="Escribe aquí el mensaje que quieres compartir..."></textarea><div class="count"><span id="chars">0</span> caracteres</div><div class="actions"><button class="secondary" onclick="loadExample()">Usar ejemplo</button><button onclick="copyMessage()">Copiar</button><button onclick="saveTemplate()">Guardar plantilla</button></div></section>
<section class="card"><b>Plantillas guardadas</b><div id="templates" class="list"></div></section><section class="card"><b>Historial de campañas</b><div id="history" class="list"></div></section>
</main><nav><button onclick="clearEditor()">Nueva</button><button class="primary" onclick="sendWhatsApp()">Enviar por WhatsApp</button></nav>
<script>
function el(id){return document.getElementById(id)}function get(k){return JSON.parse(localStorage.getItem(k)||'[]')}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}el('message').addEventListener('input',function(){el('chars').textContent=el('message').value.length});
function loadExample(){el('title').value='Toma de muestras a domicilio';el('category').value='Muestras a domicilio';el('message').value='🧪 ¿Necesitas estudios de laboratorio?\n\nEn Farmacias Medic In contamos con toma de muestras a domicilio.\n✅ Atención práctica\n✅ Resultados confiables\n✅ Agenda por WhatsApp\n\nEscríbenos para consultar disponibilidad.';el('chars').textContent=el('message').value.length}
function payload(){return{id:Date.now(),title:el('title').value.trim()||'Sin título',category:el('category').value,group:el('group').value.trim(),message:el('message').value.trim(),date:new Date().toLocaleString('es-MX')}}
function saveTemplate(){var p=payload();if(!p.message){notify('Escribe un mensaje primero');return}var a=get('templates');a.unshift(p);set('templates',a.slice(0,30));render();notify('Plantilla guardada')}
function useTemplate(id){var a=get('templates'),p=null;for(var i=0;i<a.length;i++){if(a[i].id===id){p=a[i];break}}if(!p)return;el('title').value=p.title;el('category').value=p.category;el('group').value=p.group||'';el('message').value=p.message;el('chars').textContent=p.message.length;window.scrollTo(0,0)}
function delTemplate(id){var a=get('templates').filter(function(x){return x.id!==id});set('templates',a);render()}
function sendWhatsApp(){var p=payload();if(!p.message){notify('Escribe un mensaje primero');return}var h=get('history');h.unshift(p);set('history',h.slice(0,50));render();if(window.Android&&Android.shareToWhatsApp){Android.shareToWhatsApp(p.message)}else{location.href='https://wa.me/?text='+encodeURIComponent(p.message)}}
function copyMessage(){var t=el('message').value;if(!t){notify('No hay texto para copiar');return}if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){notify('Mensaje copiado')})}else{notify('Mantén presionado para copiar')}}
function clearEditor(){el('title').value='';el('group').value='';el('message').value='';el('chars').textContent='0';window.scrollTo(0,0)}function notify(t){if(window.Android&&Android.toast)Android.toast(t);else alert(t)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function render(){var t=get('templates');var th='';if(!t.length)th='<div class="empty">Aún no tienes plantillas.</div>';for(var i=0;i<t.length;i++){var x=t[i];th+='<div class="item"><div><b>'+esc(x.title)+'</b><span>'+esc(x.category)+(x.group?' · '+esc(x.group):'')+'</span></div><div><button class="small" onclick="useTemplate('+x.id+')">Usar</button> <button class="small" onclick="delTemplate('+x.id+')">×</button></div></div>'}el('templates').innerHTML=th;var h=get('history'),hh='';if(!h.length)hh='<div class="empty">Todavía no hay envíos registrados.</div>';for(var j=0;j<h.length;j++){var y=h[j];hh+='<div class="item"><div><b>'+esc(y.title)+'</b><span>'+esc(y.date)+' · '+esc(y.category)+'</span></div></div>'}el('history').innerHTML=hh}render();
</script></body></html>
